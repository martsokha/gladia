# https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace]
members = ["xtask"]

[package]
name = "gladia"
version = "0.1.0"
authors = ["Oleh Martsokha <o.martsokha@gmail.com>"]

edition = "2024"
rust-version = "1.91"

description = "An unofficial async Rust client for the Gladia speech-to-text API."
license = "MIT"
readme = "README.md"
keywords = ["gladia", "client", "speech-to-text", "transcription", "asr"]
categories = ["api-bindings", "web-programming::http-client", "multimedia::audio"]

repository = "https://github.com/martsokha/gladia"
documentation = "https://docs.rs/gladia"

# The vendored API specs and the design notes are references for development, not
# something every downstream build should pay to download.
exclude = ["docs/"]

[features]
default = ["rustls-tls"]

# HTTPS via Rustls (default).
rustls-tls = ["reqwest/rustls"]
# HTTPS via the platform-native TLS stack.
native-tls = ["reqwest/native-tls"]

# Live transcription over WebSocket (the `live` module).
#
# `reqwest-websocket` upgrades a `reqwest` request rather than opening its own
# socket, so a live session inherits the client's TLS backend, proxy settings,
# default headers, and middleware, none of which a standalone WebSocket stack
# would see.
live = ["dep:reqwest-websocket", "dep:futures-util"]

# Structured logging and spans over HTTP operations.
tracing = ["dep:tracing"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# HTTP transport and middleware.
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart"] }
reqwest-middleware = { version = "0.5", features = ["json", "multipart"] }
reqwest-retry = { version = "0.9" }
reqwest-websocket = { version = "0.6", default-features = false, features = ["middleware"], optional = true }

# Middleware plumbing.
async-trait = { version = "0.1" }
http = { version = "1.3" }

# Serialization.
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }

# Primitive types.
chrono = { version = "0.4", default-features = false, features = ["serde", "std"] }
uuid = { version = "1.18", features = ["serde"] }

# Bytes for multipart/raw I/O.
bytes = { version = "1.10" }

# Async runtime.
tokio = { version = "1.52", default-features = false, features = ["time"] }
futures-util = { version = "0.3", default-features = false, features = ["alloc", "sink"], optional = true }

# Errors and utilities.
thiserror = { version = "2.0" }
url = { version = "2.5" }

# Observability.
tracing = { version = "0.1", optional = true }

[[example]]
name = "live"
required-features = ["live"]

[dev-dependencies]
# Async runtime.
tokio = { version = "1.52", features = ["macros", "rt-multi-thread", "fs", "time"] }
futures-util = { version = "0.3" }

# Server mocking.
wiremock = { version = "0.6" }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
